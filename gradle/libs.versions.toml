[versions]
# Core language / tooling
kotlin                  = "1.9.23"
agp                     = "8.3.2"
ksp                     = "1.9.23-1.0.19"

# AndroidX
coreKtx                 = "1.13.0"
lifecycleRuntimeKtx     = "2.7.0"
lifecycleViewmodelCompose = "2.7.0"
activityCompose         = "1.9.0"

# Compose
composeBom              = "2024.04.01"

# Navigation
navigationCompose       = "2.7.7"

# Room
room                    = "2.6.1"

# Hilt
hilt                    = "2.51.1"
hiltNavigationCompose   = "1.2.0"

# CameraX
camerax                 = "1.3.2"

# WorkManager
workmanager             = "2.9.0"

# OkHttp
okhttp                  = "4.12.0"

# DataStore
datastorePreferences    = "1.1.1"

# Kotlin extensions
kotlinxCoroutines       = "1.8.0"
kotlinxSerialization    = "1.6.3"

# Google Drive / Play Services Auth
googleApiClientAndroid  = "2.2.0"
googleApiServicesDrive  = "v3-rev20240123-2.0.0"
playServicesAuth        = "21.0.0"

# Testing
junit                   = "4.13.2"
junitExt                = "1.1.5"
espressoCore            = "3.5.1"

[libraries]
# AndroidX core
androidx-core-ktx                   = { group = "androidx.core",          name = "core-ktx",                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",        version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-compose",  version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle",    name = "lifecycle-runtime-compose",    version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose           = { group = "androidx.activity",      name = "activity-compose",             version.ref = "activityCompose" }

# Compose BOM + artifacts (version managed by BOM)
androidx-compose-bom                = { group = "androidx.compose",       name = "compose-bom",                  version.ref = "composeBom" }
androidx-compose-ui                 = { group = "androidx.compose.ui",    name = "ui" }
androidx-compose-ui-graphics        = { group = "androidx.compose.ui",    name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
androidx-compose-ui-tooling         = { group = "androidx.compose.ui",    name = "ui-tooling" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui",    name = "ui-test-manifest" }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui",    name = "ui-test-junit4" }
androidx-compose-material3          = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons     = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose         = { group = "androidx.navigation",    name = "navigation-compose",           version.ref = "navigationCompose" }

# Room
androidx-room-runtime               = { group = "androidx.room",          name = "room-runtime",                 version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",          name = "room-ktx",                     version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",          name = "room-compiler",                version.ref = "room" }

# Hilt
hilt-android                        = { group = "com.google.dagger",      name = "hilt-android",                 version.ref = "hilt" }
hilt-android-compiler               = { group = "com.google.dagger",      name = "hilt-android-compiler",        version.ref = "hilt" }
androidx-hilt-navigation-compose    = { group = "androidx.hilt",          name = "hilt-navigation-compose",      version.ref = "hiltNavigationCompose" }

# CameraX
androidx-camera-core                = { group = "androidx.camera",        name = "camera-core",                  version.ref = "camerax" }
androidx-camera-camera2             = { group = "androidx.camera",        name = "camera-camera2",               version.ref = "camerax" }
androidx-camera-lifecycle           = { group = "androidx.camera",        name = "camera-lifecycle",             version.ref = "camerax" }
androidx-camera-view                = { group = "androidx.camera",        name = "camera-view",                  version.ref = "camerax" }

# WorkManager
androidx-work-runtime-ktx           = { group = "androidx.work",          name = "work-runtime-ktx",             version.ref = "workmanager" }

# OkHttp
okhttp                              = { group = "com.squareup.okhttp3",   name = "okhttp",                       version.ref = "okhttp" }
okhttp-logging                      = { group = "com.squareup.okhttp3",   name = "logging-interceptor",          version.ref = "okhttp" }

# DataStore
androidx-datastore-preferences      = { group = "androidx.datastore",     name = "datastore-preferences",        version.ref = "datastorePreferences" }

# Kotlinx
kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",   version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core             = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-core",      version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json          = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json",   version.ref = "kotlinxSerialization" }

# Google Drive / Auth (scaffold — no impl yet)
google-api-client-android           = { group = "com.google.api-client",  name = "google-api-client-android",    version.ref = "googleApiClientAndroid" }
google-api-services-drive           = { group = "com.google.apis",        name = "google-api-services-drive",    version.ref = "googleApiServicesDrive" }
play-services-auth                  = { group = "com.google.android.gms", name = "play-services-auth",           version.ref = "playServicesAuth" }

# Testing
junit                               = { group = "junit",                  name = "junit",                        version.ref = "junit" }
androidx-junit-ext                  = { group = "androidx.test.ext",      name = "junit",                        version.ref = "junitExt" }
androidx-espresso-core              = { group = "androidx.test.espresso", name = "espresso-core",                version.ref = "espressoCore" }

[plugins]
android-application    = { id = "com.android.application",                version.ref = "agp" }
android-library        = { id = "com.android.library",                    version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android",           version.ref = "kotlin" }
kotlin-jvm             = { id = "org.jetbrains.kotlin.jvm",               version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android           = { id = "com.google.dagger.hilt.android",         version.ref = "hilt" }
ksp                    = { id = "com.google.devtools.ksp",                version.ref = "ksp" }

[bundles]
camerax = [
    "androidx-camera-core",
    "androidx-camera-camera2",
    "androidx-camera-lifecycle",
    "androidx-camera-view",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]
coroutines = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core",
]
